
name: Build and Deploy IIS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # -------------------------------------
  # 1. BUILD
  # -------------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/WebApp

      - name: Build application
        run: dotnet build src/WebApp --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish src/WebApp --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ./publish
          retention-days: 7

  # -------------------------------------
  # 2. DEPLOY QA
  # -------------------------------------
  deploy-qa:
    name: Deploy to QA
    runs-on: [self-hosted, Windows, X64]
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: QA

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: C:\Deploy\WebApp

      - name: Deploy to IIS QA
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPool = "DevOpsLab"
          $destination = "C:\inetpub\wwwroot\DevOpsLab"
          $source = "C:\Deploy\WebApp"

          try {
              Write-Host "Stopping QA AppPool..."
              Stop-WebAppPool -Name $appPool

              Start-Sleep -Seconds 3

              Write-Host "Copying application files..."
              robocopy $source $destination /E /R:3 /W:5

              $copyResult = $LASTEXITCODE

              if ($copyResult -ge 8) {
                  throw "Robocopy failed with exit code $copyResult"
              }

              $global:LASTEXITCODE = 0
          }
          finally {
              Write-Host "Starting QA AppPool..."
              Start-WebAppPool -Name $appPool
          }

      - name: QA Health Check
        shell: powershell
        run: |
          $url = "http://localhost:8085"
          $success = $false

          for ($i = 1; $i -le 10; $i++) {
              try {
                  $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "QA application is healthy."
                      $success = $true
                      break
                  }
              }
              catch {
                  Write-Host ("Attempt {0}: Application not ready yet." -f $i)
              }

              Start-Sleep -Seconds 5
          }

          if (-not $success) {
              throw "QA health check failed."
          }

  # -------------------------------------
  # 3. DEPLOY PROD
  # -------------------------------------
  deploy-prod:
    name: Deploy to PROD
    runs-on: [self-hosted, Windows, X64]
    needs: deploy-qa
    if: github.ref == 'refs/heads/main'

    environment:
      name: PROD

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: C:\Deploy\WebApp

      - name: Deploy to IIS PROD
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPool = "DevOpsLab-PROD"
          $destination = "C:\inetpub\wwwroot\DevOpsLab-PROD"
          $source = "C:\Deploy\WebApp"

          try {
              Write-Host "Stopping PROD AppPool..."
              Stop-WebAppPool -Name $appPool

              Start-Sleep -Seconds 3

              Write-Host "Copying application files..."
              robocopy $source $destination /E /R:3 /W:5

              $copyResult = $LASTEXITCODE

              if ($copyResult -ge 8) {
                  throw "Robocopy failed with exit code $copyResult"
              }

              $global:LASTEXITCODE = 0
          }
          finally {
              Write-Host "Starting PROD AppPool..."
              Start-WebAppPool -Name $appPool
          }

      - name: PROD Health Check
        shell: powershell
        run: |
          $url = "http://localhost:8086"
          $success = $false

          for ($i = 1; $i -le 10; $i++) {
              try {
                  $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "PROD application is healthy."
                      $success = $true
                      break
                  }
              }
              catch {
                  Write-Host ("Attempt {0}: Application not ready yet." -f $i)
              }

              Start-Sleep -Seconds 5
          }

          if (-not $success) {
              throw "PROD health check failed."
          }
