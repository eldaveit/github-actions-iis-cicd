
name: Build ASP.NET Core Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Preparar .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restaurar dependencias
      - name: Restore dependencies
        run: dotnet restore src/WebApp/WebApp.csproj

      # 4. Compilar
      - name: Build application
        run: dotnet build src/WebApp/WebApp.csproj --configuration Release --no-restore

      # 5. Publicar aplicación
      - name: Publish application
        run: dotnet publish src/WebApp/WebApp.csproj --configuration Release --no-build --output ./publish

      # 6. Verificar archivos generados
      - name: List published files
        run: ls -la ./publish

      # 7. Almacenar artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ./publish/
          if-no-files-found: error
          retention-days: 7
