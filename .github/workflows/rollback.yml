
name: Manual Rollback IIS

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - QA
          - PROD

      release_id:
        description: 'Release ID to restore'
        required: true
        type: string

jobs:
  rollback:
    name: Rollback ${{ inputs.target_environment }}
    runs-on: [self-hosted, Windows, X64]

    environment:
      name: ${{ inputs.target_environment }}

    steps:
      - name: Validate release
        shell: powershell
        run: |
          $releaseId = "${{ inputs.release_id }}"

          if ($releaseId -notmatch '^\d+$') {
              throw "Invalid release ID."
          }

          $releasePath = "C:\Deploy\Releases\$releaseId"

          if (!(Test-Path "$releasePath\release-info.txt")) {
              throw "Release $releaseId does not exist."
          }

          Write-Host "Release found: $releasePath"
          Get-Content "$releasePath\release-info.txt"

      - name: Execute rollback
        shell: powershell
        run: |
          Import-Module WebAdministration

          $environment = "${{ inputs.target_environment }}"
          $releaseId = "${{ inputs.release_id }}"

          # Environment configuration
          if ($environment -eq "QA") {
              $appPool = "DevOpsLab"
              $destination = "C:\inetpub\wwwroot\DevOpsLab"
              $backupRoot = "C:\Deploy\Backups\QA"
              $url = "http://localhost:8085"
          }
          elseif ($environment -eq "PROD") {
              $appPool = "DevOpsLab-PROD"
              $destination = "C:\inetpub\wwwroot\DevOpsLab-PROD"
              $backupRoot = "C:\Deploy\Backups\PROD"
              $url = "http://localhost:8086"
          }
          else {
              throw "Unsupported environment."
          }

          $source = "C:\Deploy\Releases\$releaseId"

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $backup = Join-Path $backupRoot "manual-$timestamp"

          $backupCreated = $false
          $deploymentStarted = $false
          $poolStopped = $false

          try {
              # 1. Check application pool
              if ((Get-WebAppPoolState -Name $appPool).Value -ne "Started") {
                  throw "Application Pool is not started."
              }

              # 2. Check release
              if (!(Test-Path "$source\release-info.txt")) {
                  throw "Selected release does not exist."
              }

              # 3. Stop application pool
              Write-Host "Stopping $appPool..."
              Stop-WebAppPool -Name $appPool
              $poolStopped = $true

              Start-Sleep -Seconds 3

              # 4. Backup current version
              Write-Host "Creating backup: $backup"

              New-Item -ItemType Directory -Path $backup -Force | Out-Null

              robocopy $destination $backup /MIR /R:3 /W:5
              $backupResult = $LASTEXITCODE

              if ($backupResult -ge 8) {
                  throw "Backup failed. Robocopy exit code: $backupResult"
              }

              $backupCreated = $true

              # 5. Deploy selected release
              Write-Host "Restoring release $releaseId..."

              $deploymentStarted = $true

              robocopy $source $destination /MIR /R:3 /W:5
              $deployResult = $LASTEXITCODE

              if ($deployResult -ge 8) {
                  throw "Release deployment failed. Robocopy exit code: $deployResult"
              }

              # 6. Start application pool
              Start-WebAppPool -Name $appPool
              $poolStopped = $false

              # 7. Health check
              $success = $false

              for ($i = 1; $i -le 10; $i++) {
                  try {
                      $response = Invoke-WebRequest `
                          -Uri $url `
                          -UseBasicParsing `
                          -TimeoutSec 5

                      if ($response.StatusCode -eq 200) {
                          $success = $true
                          break
                      }
                  }
                  catch {
                      Write-Host ("Health check attempt {0} failed." -f $i)
                  }

                  Start-Sleep -Seconds 5
              }

              if (!$success) {
                  throw "Health check failed."
              }

              Write-Host "$environment successfully restored to release $releaseId."
          }
          catch {
              Write-Host "ROLLBACK OPERATION FAILED: $_"

              # Restore the version that was active before this operation
              if ($deploymentStarted -and $backupCreated) {
                  try {
                      Write-Host "Restoring previous version..."

                      if (!$poolStopped) {
                          Stop-WebAppPool -Name $appPool
                          $poolStopped = $true
                          Start-Sleep -Seconds 3
                      }

                      robocopy $backup $destination /MIR /R:3 /W:5
                      $restoreResult = $LASTEXITCODE

                      if ($restoreResult -ge 8) {
                          throw "Previous version restoration failed."
                      }

                      Write-Host "Previous version restored."
                  }
                  catch {
                      Write-Error "CRITICAL: Recovery failed: $_"
                      throw
                  }
              }

              throw
          }
          finally {
              if ($poolStopped) {
                  Write-Host "Starting application pool..."
                  Start-WebAppPool -Name $appPool
              }

              $global:LASTEXITCODE = 0
          }
